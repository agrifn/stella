# STELLA backend: a single FastAPI container (local embedding intent classifier + Piper
# TTS). No Ollama / LLM, no GPU needed. The native Windows client talks to it at
# http://localhost:8420.
#
#   docker compose up -d --build
services:
  stella-api:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: stella-api
    container_name: stella-api
    restart: unless-stopped
    # Optional: reach a host-side Chatterbox TTS service if the chat engine is set to it.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Optional shared secret; when set, every route except /health needs a Bearer token.
      STELLA_API_TOKEN: ${STELLA_API_TOKEN:-}
      # Intent engine: static embedding classifier (CPU, numpy-only). No LLM.
      STELLA_CLASSIFIER_MODEL: ${STELLA_CLASSIFIER_MODEL:-minishlab/potion-base-32M}
      # TTS: Piper-only by default (self-contained). Set a *_CHAT_ENGINE to chatterbox
      # only if you run the optional host-side Chatterbox service on :8123.
      STELLA_TTS_ACK_ENGINE: ${STELLA_TTS_ACK_ENGINE:-piper}
      STELLA_TTS_CHAT_ENGINE: ${STELLA_TTS_CHAT_ENGINE:-piper}
      STELLA_TTS_ENGINE: ${STELLA_TTS_ENGINE:-piper}
      STELLA_CHATTERBOX_URL: ${STELLA_CHATTERBOX_URL:-http://host.docker.internal:8123}
    ports:
      - "8420:8420"
    # Mount config so command edits (CRUD) persist on the host;
    # voices volume so added/selected voices survive rebuilds.
    volumes:
      - ./config:/app/config
      - voices:/opt/voices
    networks: [stella]

networks:
  stella:

volumes:
  voices:
